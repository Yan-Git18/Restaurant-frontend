<p>rol-dialog-component works!</p>
<div class="dialog-container">
  <!-- Header -->
  <div class="dialog-header">
    <div class="header-content">
      <mat-icon class="header-icon">{{ rol.id ? 'edit' : 'add_circle' }}</mat-icon>
      <h2 mat-dialog-title class="dialog-title">
        {{ rol.id ? 'Editar Rol' : 'Nuevo Rol' }}
      </h2>
    </div>
    <button mat-icon-button class="close-button" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Content -->
  <mat-dialog-content class="dialog-content">
    <div class="form-container">
      
      <div class="form-description">
        <mat-icon>info</mat-icon>
        <p>{{ rol.id ? 'Modifica la información del rol' : 'Completa el formulario para crear un nuevo rol' }}</p>
      </div>

      <form class="form-fields">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nombre del Rol</mat-label>
          <input 
            matInput 
            placeholder="Ej. Administrador, Mesero, Cocinero" 
            [(ngModel)]="rol.nombre"
            name="nombre"
            required
          />
          <mat-icon matPrefix>label</mat-icon>
          <mat-hint>Ingresa un nombre descriptivo para el rol</mat-hint>
        </mat-form-field>
      </form>

    </div>
  </mat-dialog-content>

  <!-- Actions -->
  <mat-dialog-actions class="dialog-actions">
    <button 
      mat-stroked-button 
      class="cancel-button"
      (click)="close()">
      <mat-icon>close</mat-icon>
      Cancelar
    </button>
    <button 
      mat-raised-button 
      color="primary"
      class="save-button"
      (click)="operate()">
      <mat-icon>{{ rol.id ? 'save' : 'add' }}</mat-icon>
      {{ rol.id ? 'Guardar Cambios' : 'Crear Rol' }}
    </button>
  </mat-dialog-actions>
</div>
