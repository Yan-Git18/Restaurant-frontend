<div class="dialog-crear">
  <h2 mat-dialog-title>Registrar Pedido</h2>

  <div mat-dialog-content [formGroup]="form" class="contenido">
    
    <!-- FILA: Mesa + Mesero -->
    <div class="fila-dos">
      <mat-form-field appearance="outline">
        <mat-label>Mesa</mat-label>
        <mat-select formControlName="mesaId">
          <mat-option *ngFor="let m of mesas" [value]="m.id">
            Mesa {{ m.numero }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Mesero</mat-label>
        <mat-select formControlName="usuarioId">
          <mat-option *ngFor="let u of usuarios" [value]="u.id">
            {{ u.nombre }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- FILA: Cliente -->
    <div class="fila-uno cliente-full">
      <mat-form-field appearance="outline" class="cliente-field">
        <mat-label>Cliente</mat-label>
        <mat-select formControlName="clienteId">
          <mat-option [value]="null">Sin cliente</mat-option>
          <mat-option *ngFor="let c of clientes" [value]="c.id">
            {{ c.usuario?.nombre }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- DETALLES -->
    <h3>Detalles</h3>

    <div formArrayName="detalles" class="detalles-grid">
      <div
        *ngFor="let d of detalles.controls; let i = index"
        [formGroupName]="i"
        class="detalle-item"
      >

        <!-- PRODUCTO -->
        <mat-form-field appearance="outline" class="producto-field">
          <mat-label>Producto</mat-label>
          <mat-select formControlName="productoId">
            <mat-option *ngFor="let p of productos" [value]="p.id">
              {{ p.nombre }} - S/ {{ p.precio }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <!-- CANTIDAD -->
        <mat-form-field appearance="outline" class="cantidad-field">
          <mat-label>Cantidad</mat-label>
          <input matInput type="number" formControlName="cantidad" min="1" />
        </mat-form-field>

        <!-- SUBTOTAL -->
        <span class="subtotal">
          S/ {{ getSubtotal(i) | number : '1.2-2' }}
        </span>

        <!-- ELIMINAR -->
        <button mat-icon-button color="warn" (click)="removeDetalle(i)">
          <mat-icon>delete</mat-icon>
        </button>

      </div>
    </div>

    <!-- BOTÓN AGREGAR PRODUCTO -->
    <button mat-button color="primary" (click)="addDetalle()">
      <mat-icon>add</mat-icon> Agregar Producto
    </button>

    <!-- TOTAL -->
    <h2 class="total">Total: S/ {{ getTotal() | number : '1.2-2' }}</h2>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-button (click)="close()">Cancelar</button>
    <button
      mat-raised-button
      color="primary"
      (click)="save()"
      [disabled]="form.invalid || getTotal() === 0"
    >
      Guardar Pedido
    </button>
  </div>
</div>
