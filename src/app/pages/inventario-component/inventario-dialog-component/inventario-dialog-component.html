<h2 mat-dialog-title>{{ esEdicion ? 'Editar Inventario' : 'Nuevo Inventario' }}</h2>

<mat-dialog-content>
  <form #formInventario="ngForm">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Nombre</mat-label>
      <input matInput [(ngModel)]="inventario.nombre" name="nombre" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Stock Total</mat-label>
      <input matInput type="number" [(ngModel)]="inventario.stockTotal" name="stockTotal" required min="0" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Unidad de Medida</mat-label>
      <mat-select [(ngModel)]="inventario.unidadMedida" name="unidadMedida" required>
        <mat-option value="unidades">Unidades</mat-option>
        <mat-option value="litros">Litros</mat-option>
        <mat-option value="kg">Kilogramos</mat-option>
        <mat-option value="cajas">Cajas</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Mínimo Stock</mat-label>
      <input matInput type="number" [(ngModel)]="inventario.minimoStock" name="minimoStock" required min="0" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="operate()" [disabled]="formInventario.invalid">
    {{ esEdicion ? 'Actualizar' : 'Guardar' }}
  </button>
</mat-dialog-actions>
