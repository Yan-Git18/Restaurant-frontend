<h2 mat-dialog-title>{{ producto.id ? 'Editar Producto' : 'Nuevo Producto' }}</h2>
<mat-dialog-content>
  <form class="formulario" (ngSubmit)="operate()">
    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Nombre</mat-label>
      <input matInput [(ngModel)]="producto.nombre" name="nombre" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Descripción</mat-label>
      <textarea matInput [(ngModel)]="producto.descripcion" name="descripcion"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Precio</mat-label>
      <input matInput type="number" [(ngModel)]="producto.precio" name="precio" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100">
      <mat-label>Stock</mat-label>
      <input matInput type="number" [(ngModel)]="producto.stock" name="stock" required />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="operate()">
    {{ producto.id ? 'Actualizar' : 'Registrar' }}
  </button>
</mat-dialog-actions>
