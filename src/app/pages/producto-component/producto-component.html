<div class="header-card mat-elevation-z3">
  <div>
    <h2>Gestión de Productos</h2>
    <p>Administra precios, stock y categorías</p>
  </div>
  <button mat-raised-button color="primary" (click)="openDialog()">
    <mat-icon>add</mat-icon> Nuevo Producto
  </button>
</div>

<div class="stats-card mat-elevation-z2">
  <mat-icon class="icon">inventory_2</mat-icon>
  <div>
    <h3>Stock total disponible</h3>
    <span class="count">{{ totalStock }}</span>
  </div>
</div>

<div class="table-container mat-elevation-z4">
  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Buscar producto</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Gaseosa, Pizza..." />
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let row">{{ row.id }}</td>
    </ng-container>

    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="categoria">
      <th mat-header-cell *matHeaderCellDef>Categoría</th>
      <td mat-cell *matCellDef="let row">
        {{ getCategoriaNombre(row.categoriaId) }}
      </td>
    </ng-container>

    <ng-container matColumnDef="precio">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio</th>
      <td mat-cell *matCellDef="let row">S/. {{ row.precio }}</td>
    </ng-container>

    <ng-container matColumnDef="stockActual">
      <th mat-header-cell *matHeaderCellDef>Stock</th>
      <td mat-cell *matCellDef="let row">
        <span [ngClass]="{ low: row.stockActual <= 5 }">
          {{ row.stockActual }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="primary" matTooltip="Editar" (click)="openDialog(row)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="openDeleteDialog(row)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="getDisplayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: getDisplayedColumns()"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
