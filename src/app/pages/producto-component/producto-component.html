<div class="table-container">
  <!-- Header -->
  <div class="table-header">
    <h2 class="table-title">
      <mat-icon class="title-icon">shopping_basket</mat-icon>
      Gestión de Productos
    </h2>
    <div class="header-actions">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Buscar producto</mat-label>
        <input
          matInput
          (keyup)="applyFilter($event)"
          placeholder="Ej. Pizza, Hamburguesa, Refresco"
          #input
        />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <button
        mat-fab
        extended
        color="primary"
        class="add-button"
        (click)="openDialog()">
        <mat-icon>add</mat-icon>
        Nuevo Producto
      </button>
    </div>
  </div>

  <!-- Tabla -->
  <div class="table-wrapper mat-elevation-z4">
    <table mat-table [dataSource]="dataSource" matSort class="styled-table">

      <!-- Nombre -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          <div class="header-cell">
            Nombre
          </div>
        </th>
        <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
      </ng-container>

      <!-- Precio -->
      <ng-container matColumnDef="precio">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          <div class="header-cell">
            Precio
          </div>
        </th>
        <td mat-cell *matCellDef="let row">S/ {{ row.precio | number:'1.2-2' }}</td>
      </ng-container>

      <!-- Categoría -->
      <ng-container matColumnDef="categoria">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          <div class="header-cell">
            Categoría
          </div>
        </th>
        <td mat-cell *matCellDef="let row">{{ row.categoria?.nombre }}</td>
      </ng-container>

      <!-- Stock actual -->
      <ng-container matColumnDef="stockActual">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          <div class="header-cell">
            Stock
          </div>
        </th>
        <td mat-cell *matCellDef="let row">{{ row.stockActual }}</td>
      </ng-container>

      <!-- Descripción -->
      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>
          <div class="header-cell">
            Descripción
          </div>
        </th>
        <td mat-cell *matCellDef="let row">{{ row.descripcion }}</td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          <div class="header-cell">
            Acciones
          </div>
        </th>
        <td mat-cell *matCellDef="let row">
          <div class="action-buttons">
            <button mat-icon-button color="primary" matTooltip="Editar" (click)="openDialog(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="openDeleteDialog(row)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="getDisplayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: getDisplayedColumns()"></tr>

      <tr class="mat-row no-data-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="getDisplayedColumns().length">
          <div class="no-data">
            <mat-icon>inbox</mat-icon>
            <p>No se encontraron resultados para "{{ input.value }}"</p>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <mat-paginator
    [pageSizeOptions]="[10, 25, 50, 100]"
    showFirstLastButtons
    class="styled-paginator"
    aria-label="Selecciona página de productos">
  </mat-paginator>
</div>
