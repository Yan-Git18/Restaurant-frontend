<div class="table-container">
  <!-- Encabezado -->
  <div class="table-header">
    <h2 class="table-title">
      <mat-icon class="title-icon">people</mat-icon>
      Gestión de Mesas
    </h2>

    <div class="header-actions">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Buscar mesa</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Mesa 1" />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <button mat-flat-button color="primary" class="add-button" (click)="openDialog()">
        <mat-icon>add</mat-icon>
        Nueva Mesa
      </button>
    </div>
  </div>

  <!-- Tabla -->
  <div class="table-wrapper mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="numero">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Número</th>
        <td mat-cell *matCellDef="let row">{{ row.numero }}</td>
      </ng-container>

      <ng-container matColumnDef="ubicacion">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Ubicación</th>
        <td mat-cell *matCellDef="let row">{{ row.ubicacion }}</td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Estado</th>
        <td mat-cell *matCellDef="let row">{{ row.estado }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <div class="action-buttons">
            <button mat-icon-button color="primary" matTooltip="Editar" (click)="openDialog(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="openDeleteDialog(row)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="getDisplayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: getDisplayedColumns()"></tr>
    </table>
  </div>

  <!-- Paginador -->
  <mat-paginator
    [pageSizeOptions]="[10, 25, 50]"
    aria-label="Selecciona página de mesas"
    class="styled-paginator">
  </mat-paginator>
</div>
