<mat-dialog-content>
  <mat-toolbar color="primary">
    <span>{{ mesa.id ? 'Editar Mesa' : 'Nueva Mesa' }}</span>
  </mat-toolbar>

  <div class="example-container">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Número</mat-label>
      <input matInput type="number" [(ngModel)]="mesa.numero" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Ubicación</mat-label>
      <input matInput [(ngModel)]="mesa.ubicacion" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Estado</mat-label>
      <mat-select [(ngModel)]="mesa.estado">
        <mat-option value="Disponible">Disponible</mat-option>
        <mat-option value="Ocupada">Ocupada</mat-option>
        <mat-option value="Reservada">Reservada</mat-option>
        <mat-option value="Mantenimiento">Mantenimiento</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="flex justify-end gap-2 mt-4">
      <button mat-button color="primary" (click)="operate()">Guardar</button>
      <button mat-button color="warn" (click)="close()">Cancelar</button>
    </div>
  </div>
</mat-dialog-content>
