<div class="table-container">
  <div class="table-header">
    <h2 class="table-title">
      <mat-icon>category</mat-icon>
      Gestión de Categorías
    </h2>
    <div class="header-actions">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Buscar categoría</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Bebidas" #input />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>
      <button mat-fab extended color="primary" (click)="openDialog()">
        <mat-icon>add</mat-icon> Nueva Categoría
      </button>
    </div>
  </div>

  <div class="table-wrapper mat-elevation-z4">
    <table mat-table [dataSource]="dataSource" matSort>
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="primary" matTooltip="Editar" (click)="openDialog(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="openDeleteDialog(row)">
              <mat-icon>delete</mat-icon>
            </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="getDisplayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: getDisplayedColumns()"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td colspan="3">No se encontraron resultados para "{{ input.value }}"</td>
      </tr>
    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
</div>
