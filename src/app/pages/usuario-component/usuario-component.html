<div class="table-container">
  <div class="table-header">
    <h2 class="table-title">
      <mat-icon class="title-icon">people</mat-icon>
      Gestión de Usuarios
    </h2>

    <div class="header-actions">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Buscar usuario</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Administrador" />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <button mat-flat-button color="primary" class="add-button" (click)="openDialog()">
        <mat-icon>add</mat-icon>
        Nuevo Usuario
      </button>
    </div>
  </div>

  <div class="table-wrapper mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>
      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <!-- Nombre -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
      </ng-container>

      <!-- Correo -->
      <ng-container matColumnDef="correo">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Correo</th>
        <td mat-cell *matCellDef="let row">{{ row.correo }}</td>
      </ng-container>

      <!-- Roles -->
      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef>Roles</th>
        <td mat-cell *matCellDef="let row">{{ getRolesAsString(row) }}</td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <div class="action-buttons">
            <button mat-icon-button color="primary" matTooltip="Editar" (click)="openDialog(row)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="openDeleteDialog(row)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="getDisplayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: getDisplayedColumns()"></tr>
    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[10, 25, 50]" aria-label="Selecciona página de usuarios" class="styled-paginator"></mat-paginator>
</div>
