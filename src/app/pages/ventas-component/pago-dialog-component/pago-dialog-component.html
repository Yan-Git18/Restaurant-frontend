<h2 mat-dialog-title>Registrar Pago</h2>

<mat-dialog-content>
  <form [formGroup]="form">

    <!-- Selección de método -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Método de Pago</mat-label>
      <mat-select formControlName="metodo">
        <mat-option *ngFor="let m of metodosPago" [value]="m">
          {{ m }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <!-- Monto -->
    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Monto</mat-label>
      <input matInput type="number" formControlName="monto" min="0.01" />
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="registrar()" [disabled]="form.invalid">
    Registrar
  </button>
</mat-dialog-actions>
