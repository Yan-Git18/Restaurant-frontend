<h2 mat-dialog-title>Generar Comprobante — Venta #{{ venta?.id }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Tipo</mat-label>
      <mat-select formControlName="tipo">
        <mat-option value="Boleta">Boleta</mat-option>
        <mat-option value="Factura">Factura</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Formato</mat-label>
      <mat-select formControlName="formato">
        <mat-option value="Físico">Físico</mat-option>
        <mat-option value="Electrónico">Electrónico</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full">
      <mat-label>Número</mat-label>
      <input matInput formControlName="numero" />
      <mat-hint>Formato libre — puedes generar según tu numeración</mat-hint>
    </mat-form-field>

    <div class="venta-resumen">
      <p><strong>Total:</strong> S/. {{ venta?.total }}</p>
      <p><strong>Pedido:</strong> #{{ venta?.pedidoId }}</p>
      <p><strong>Cliente:</strong> #{{ venta?.clienteId }}</p>
    </div>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button color="warn" (click)="cancel()">Cancelar</button>
  <button mat-raised-button color="primary" (click)="saveComprobante()" [disabled]="form.invalid">Guardar Comprobante</button>
</mat-dialog-actions>
