<div class="header-card mat-elevation-z3">
  <div>
    <h2>Ventas</h2>
    <p>Listado de ventas realizadas</p>
  </div>
  <div class="actions">
    <button mat-raised-button color="primary" (click)="openGenerarVenta()">
      <mat-icon>add</mat-icon> Generar Venta
    </button>
    <button mat-icon-button (click)="loadVentas()" matTooltip="Actualizar">
      <mat-icon>refresh</mat-icon>
    </button>
  </div>
</div>

<div class="table-container mat-elevation-z4">
  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Buscar</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="ID, clienteId, pedidoId..." />
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" matSort class="full-width">

    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let v">{{ v.id }}</td>
    </ng-container>

    <ng-container matColumnDef="fecha">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha</th>
      <td mat-cell *matCellDef="let v">{{ v.fecha | date:'short' }}</td>
    </ng-container>

    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Total</th>
      <td mat-cell *matCellDef="let v">S/. {{ v.total }}</td>
    </ng-container>

    <ng-container matColumnDef="pedidoId">
      <th mat-header-cell *matHeaderCellDef>Pedido</th>
      <td mat-cell *matCellDef="let v">#{{ v.pedidoId }}</td>
    </ng-container>

    <ng-container matColumnDef="clienteId">
      <th mat-header-cell *matHeaderCellDef>Cliente</th>
      <td mat-cell *matCellDef="let v">#{{ v.clienteId }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let v">
        <button mat-icon-button color="primary" matTooltip="Registrar pago" (click)="openPagoDialog(v)">
          <mat-icon>payment</mat-icon>
        </button>

        <button mat-icon-button color="accent" matTooltip="Generar/Ver comprobante" (click)="openComprobanteDialog(v)">
          <mat-icon>receipt_long</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons></mat-paginator>
</div>
