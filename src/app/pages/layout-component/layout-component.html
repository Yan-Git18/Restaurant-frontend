<div class="layout-container">

  <!-- TOP BAR -->
  <mat-toolbar color="primary" class="top-bar">
    
    <div class="left-zone">
      <button mat-icon-button (click)="sidenav.toggle()" class="toggle-btn">
        <mat-icon>menu</mat-icon>
      </button>

      <mat-icon class="app-icon">restaurant</mat-icon>
      <span class="app-title">Restaurant</span>
    </div>

    <div class="spacer"></div>

    <!-- PERFIL EN LA ESQUINA DERECHA -->
    <div class="top-profile" [matMenuTriggerFor]="settingsMenu">
      <div class="profile-circle">{{ userInitials }}</div>

      <div class="profile-info">
        <span class="user-name">{{ userName }}</span>
        <span class="user-role">{{ userRole }}</span>
      </div>

      <mat-icon class="arrow">expand_more</mat-icon>
    </div>

    <!-- MENÚ DE PERFIL -->
    <mat-menu #settingsMenu="matMenu">
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>

  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">

    <!-- SIDEBAR -->
    <mat-sidenav #sidenav class="sidenav" mode="side" opened>

      <nav class="menu-list custom-scroll">
        @for (m of menus; track $index) {
          <button
            class="menu-item"
            routerLink="{{ m.url }}"
            routerLinkActive="active">
            <mat-icon class="menu-icon">{{ m.icon }}</mat-icon>
            <span>{{ m.name }}</span>
          </button>
        }
      </nav>

    </mat-sidenav>

    <!-- CONTENIDO -->
    <mat-sidenav-content class="main-content custom-scroll">
      <div class="content-wrapper">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>

  </mat-sidenav-container>

</div>
