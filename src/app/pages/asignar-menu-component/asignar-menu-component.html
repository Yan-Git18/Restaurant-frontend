<div class="table-container">

  <h2 class="table-title">
    <mat-icon>assignment</mat-icon>
    Asignación Menú → Rol
  </h2>

  <!-- Seleccionar rol -->
  <mat-form-field appearance="outline" class="w-50">
    <mat-label>Seleccionar Rol</mat-label>
    <mat-select [(ngModel)]="selectedRol" (selectionChange)="onRolSelected()">
      <mat-option *ngFor="let r of roles" [value]="r">
        {{ r.nombre }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Botón abrir modal -->
  <button mat-flat-button color="primary" (click)="openDialog()" [disabled]="!selectedRol">
    <mat-icon>add</mat-icon>
    Asignar Menú
  </button>

  <!-- Tabla -->
  <div *ngIf="dataSource" class="table-wrapper mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let row">{{ row.name }}</td>
      </ng-container>

      <ng-container matColumnDef="icon">
        <th mat-header-cell *matHeaderCellDef>Icono</th>
        <td mat-cell *matCellDef="let row">{{ row.icon }}</td>
      </ng-container>

      <ng-container matColumnDef="url">
        <th mat-header-cell *matHeaderCellDef>URL</th>
        <td mat-cell *matCellDef="let row">{{ row.url }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button color="warn" (click)="openDeleteDialog(row)">
            <mat-icon>link_off</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>

    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[10, 25, 50]"></mat-paginator>
</div>
