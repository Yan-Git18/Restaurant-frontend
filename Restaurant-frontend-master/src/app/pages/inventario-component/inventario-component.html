<div class="table-container">
  <!-- Encabezado -->
  <div class="table-header">
    <h2 class="table-title">
      <mat-icon class="title-icon">inventory</mat-icon>
      Gestión de Inventarios
    </h2>

    <div class="header-actions">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Buscar inventario</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ej. Nombre o Unidad" />
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <button mat-flat-button color="primary" class="add-button" (click)="openDialog()">
        <mat-icon>add</mat-icon>
        Nuevo Inventario
      </button>
    </div>
  </div>

  <!-- Tabla -->
  <div class="table-wrapper mat-elevation-z2">
    <table mat-table [dataSource]="dataSource" matSort>

      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>

      <!-- Nombre -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
        <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
      </ng-container>

      <!-- Stock Total -->
      <ng-container matColumnDef="stockTotal">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock Total</th>
        <td mat-cell *matCellDef="let row">{{ row.stockTotal }}</td>
      </ng-container>

      <!-- Unidad de Medida -->
      <ng-container matColumnDef="unidadMedida">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Unidad</th>
        <td mat-cell *matCellDef="let row">{{ row.unidadMedida }}</td>
      </ng-container>

      <!-- Mínimo Stock -->
      <ng-container matColumnDef="minimoStock">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Mínimo</th>
        <td mat-cell *matCellDef="let row">{{ row.minimoStock }}</td>
      </ng-container>

      <!-- Acciones -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <div class="action-buttons">
            <button mat-icon-button color="primary" matTooltip="Editar" (click)="openDialog(row)">
              <mat-icon>edit</mat-icon>

            </button>

           <button mat-icon-button color="warn" matTooltip="Eliminar" (click)="openDeleteDialog(row)">
            <mat-icon>delete</mat-icon>
          </button>

          </div>
        </td>
      </ng-container>

      <!-- Filas -->
      <tr mat-header-row *matHeaderRowDef="getDisplayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: getDisplayedColumns()"></tr>
    </table>
  </div>

  <!-- Paginador -->
  <mat-paginator
    [pageSizeOptions]="[5, 10, 25]"
    showFirstLastButtons
    aria-label="Paginador de inventarios"
    class="styled-paginator">
  </mat-paginator>
</div>
