<mat-dialog-content>
  <mat-toolbar color="primary">
    <span>{{ data?.id ? 'Editar Cliente' : 'Nuevo Cliente' }}</span>
  </mat-toolbar>

  <form [formGroup]="form" class="example-container">
    <!-- Teléfono -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="telefono" placeholder="Ej. 987654321" />
      <mat-error *ngIf="form.get('telefono')?.hasError('required')">
        El teléfono es obligatorio.
      </mat-error>
      <mat-error *ngIf="form.get('telefono')?.hasError('pattern')">
        Debe tener 9 dígitos numéricos.
      </mat-error>
    </mat-form-field>

    <!-- Dirección -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Dirección</mat-label>
      <input matInput formControlName="direccion" placeholder="Ej. Av. Los Álamos 123" />
      <mat-error *ngIf="form.get('direccion')?.hasError('required')">
        La dirección es obligatoria.
      </mat-error>
      <mat-error *ngIf="form.get('direccion')?.hasError('minlength')">
        Mínimo 5 caracteres.
      </mat-error>
    </mat-form-field>

    <!-- Usuario -->
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Usuario</mat-label>
      <mat-select formControlName="usuario">
        <mat-option *ngFor="let u of usuarios" [value]="u">{{ u.nombre }}</mat-option>
      </mat-select>
      <mat-error *ngIf="form.get('usuario')?.hasError('required')">
        Selecciona un usuario.
      </mat-error>
    </mat-form-field>

    <div class="flex justify-end gap-2 mt-4">
      <button mat-stroked-button color="warn" (click)="close()">Cancelar</button>
      <button mat-raised-button color="primary" (click)="operate()">
        {{ data?.id ? 'Guardar Cambios' : 'Crear Cliente' }}
      </button>
    </div>
  </form>
</mat-dialog-content>
