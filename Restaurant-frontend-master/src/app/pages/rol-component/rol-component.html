<div class="table-container">
  <!-- Header con filtro y botón -->
  <div class="table-header">
    <h2 class="table-title">
      <mat-icon class="title-icon">admin_panel_settings</mat-icon>
      Gestión de Roles
    </h2>
    <div class="header-actions">
      <mat-form-field appearance="outline" class="filter-field">
        <mat-label>Buscar roles</mat-label>
        <input 
          matInput 
          (keyup)="applyFilter($event)" 
          placeholder="Ej. Administrador"
          #input
        />
        <mat-icon matPrefix>search</mat-icon> 
      </mat-form-field>
      
      <button 
        mat-fab 
        extended 
        color="primary" 
        class="add-button"
        (click)="openDialog()">
        <mat-icon>add</mat-icon>
        Nuevo Rol
      </button>
    </div>
  </div>

  <!-- Tabla -->
  <div class="table-wrapper mat-elevation-z4">
    <table mat-table [dataSource]="dataSource" matSort class="styled-table">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          <div class="header-cell">
            <mat-icon class="header-icon">tag</mat-icon>
            ID
          </div>
        </th>
        <td mat-cell *matCellDef="let row">
          <span class="id-badge">{{ row.id }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          <div class="header-cell">
            <mat-icon class="header-icon">label</mat-icon>
            Nombre
          </div>
        </th>
        <td mat-cell *matCellDef="let row">
          <span class="role-name">{{ row.nombre }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          <div class="header-cell">
            <mat-icon class="header-icon">settings</mat-icon>
            Acciones
          </div>
        </th>
        <td mat-cell *matCellDef="let row">
          <div class="action-buttons">
            <button 
              mat-mini-fab 
              color="primary" 
              class="action-btn edit-btn"
              (click)="openDialog(row)"
              matTooltip="Editar rol">
              <mat-icon>edit</mat-icon>
            </button>
            <button 
              mat-mini-fab 
              color="warn" 
              class="action-btn delete-btn"
              (click)="openDeleteDialog(row)"
              matTooltip="Eliminar rol">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="getDisplayedColumns()" class="header-row"></tr>
      <tr mat-row *matRowDef="let row; columns: getDisplayedColumns()" class="data-row"></tr>

      <!-- Fila cuando no hay datos -->
      <tr class="mat-row no-data-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="getDisplayedColumns().length">
          <div class="no-data">
            <mat-icon>inbox</mat-icon>
            <p>No se encontraron resultados para "{{ input.value }}"</p>
          </div>
        </td>
      </tr>
    </table>
  </div>

  <!-- Paginador -->
  <mat-paginator
    [pageSizeOptions]="[10, 25, 50, 100]"
    showFirstLastButtons
    class="styled-paginator"
    aria-label="Selecciona página de roles">
  </mat-paginator>
</div>
